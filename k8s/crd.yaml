apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourceclaims.atropos.platform.io
spec:
  group: atropos.platform.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                poolType:
                  type: string
                ttlSeconds:
                  type: integer
                tenantId:
                  type: string
            status:
              type: object
              properties:
                leaseId:
                  type: string
                status:
                  type: string
  scope: Namespaced
  names:
    plural: resourceclaims
    singular: resourceclaim
    kind: ResourceClaim
    shortNames:
    - rclaim
