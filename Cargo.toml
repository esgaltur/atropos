[package]
name = "atropos"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# --- NEW: SPEED UP DEV BUILDS ---
[profile.dev]
opt-level = 0
debug = true

# Optimize dependencies even in dev mode (makes the app run faster)
[profile.dev.package."*"]
opt-level = 3

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
strum = { version = "0.26", features = ["derive"] }

# Async runtime and Web framework
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Utilities
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
askama = "0.12"
askama_axum = "0.4"
moka = { version = "0.12.14", features = ["future"] }
tracing-opentelemetry = "0.32.1"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry = "0.31.0"
tonic = "0.12"
prost = "0.13"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
cucumber = "0.21"

[build-dependencies]
tonic-build = "0.12"
